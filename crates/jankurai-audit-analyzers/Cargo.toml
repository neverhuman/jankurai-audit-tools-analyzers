[package]
name = "jankurai-audit-analyzers"
version = "0.1.0"
edition = "2021"
description = "Dimension analyzers and scoring suite for the jankurai audit standard."
license = "MIT"
repository = "https://github.com/neverhuman/jankurai-tools-analyzers"
homepage = "https://github.com/neverhuman/jankurai"
keywords = ["agent", "audit", "analyzers", "scoring", "rust"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0"
globset = "0.4"
jankurai-audit-dedup = { git = "https://github.com/neverhuman/jankurai-tools-dedup.git", tag = "jankurai-tools-dedup-v1.7.0-split.2", package = "jankurai-audit-dedup", version = "0.1.0" }
jankurai-audit-kernel = { git = "https://github.com/neverhuman/jankurai-tools-kernel.git", rev = "e079e716c02390446a7d13abc46bc7b9ea6ab93f", package = "jankurai-audit-kernel", version = "0.1.0" }
once_cell = "1.21"
oxc_allocator = "=0.149.0"
oxc_ast = "=0.149.0"
oxc_ast_visit = "=0.149.0"
oxc_parser = "=0.149.0"
oxc_span = "=0.149.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
rayon = "1.11"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
syn = { version = "2.0", features = ["full", "visit"] }
toml = "0.9"
walkdir = "2.5"

[dev-dependencies]
proptest = "1"
tempfile = "3.23"
